<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <title>Ataru search recall path</title>
  <desc>Editorial interface diagram showing a query becoming turn, session, and project context.</desc>
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#181818" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#E8E6DC" stroke-width="1" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="38" fill="#F9F9F7"/>
  <rect x="48" y="48" width="1504" height="804" rx="30" fill="url(#grid)" opacity="0.42"/>
  <circle cx="118" cy="112" r="17" fill="#3EA866"/>
  <path d="M101 112L117 80L151 112L117 144L101 112Z" fill="#5DC98F"/>
  <text x="154" y="120" fill="#181818" font-family="Georgia, serif" font-size="28" font-weight="700">Ataru search surface</text>
  <text x="154" y="151" fill="#87867F" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">LOCAL RECALL · CONTEXT FIRST</text>

  <g filter="url(#card-shadow)">
    <rect x="88" y="216" width="356" height="562" rx="28" fill="#FFFFFF" stroke="#E8E6DC" stroke-width="2"/>
  </g>
  <text x="126" y="268" fill="#87867F" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">QUERY</text>
  <rect x="126" y="296" width="280" height="58" rx="18" fill="#F0EEE6"/>
  <circle cx="153" cy="325" r="10" stroke="#181818" stroke-width="3"/>
  <path d="M161 333L171 343" stroke="#181818" stroke-width="3" stroke-linecap="round"/>
  <text x="190" y="333" fill="#181818" font-family="Arial, sans-serif" font-size="17">index not updating</text>
  <text x="126" y="411" fill="#87867F" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">LEVEL</text>
  <rect x="126" y="438" width="82" height="36" rx="18" fill="#CC785C"/>
  <text x="151" y="462" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">TURN</text>
  <rect x="218" y="438" width="98" height="36" rx="18" fill="#F0EEE6"/>
  <text x="239" y="462" fill="#181818" font-family="Arial, sans-serif" font-size="14">SESSION</text>
  <rect x="326" y="438" width="80" height="36" rx="18" fill="#F0EEE6"/>
  <text x="344" y="462" fill="#181818" font-family="Arial, sans-serif" font-size="14">PROJECT</text>
  <path d="M126 530H384M126 562H352M126 594H374M126 626H320" stroke="#E8E6DC" stroke-width="10" stroke-linecap="round"/>
  <rect x="126" y="687" width="132" height="40" rx="20" fill="#181818"/>
  <text x="158" y="713" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">RECALL</text>

  <path d="M468 497H516" stroke="#CC785C" stroke-width="4" stroke-linecap="round"/>
  <path d="M506 487L518 497L506 507" stroke="#CC785C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="548" y="268" fill="#87867F" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">MATCHES</text>
  <g filter="url(#card-shadow)">
    <rect x="548" y="300" width="520" height="138" rx="24" fill="#FFFFFF" stroke="#E8E6DC" stroke-width="2"/>
    <rect x="548" y="462" width="520" height="138" rx="24" fill="#FFFFFF" stroke="#E8E6DC" stroke-width="2"/>
    <rect x="548" y="624" width="520" height="138" rx="24" fill="#FFFFFF" stroke="#E8E6DC" stroke-width="2"/>
  </g>
  <circle cx="586" cy="340" r="14" fill="#CC785C"/>
  <text x="579" y="346" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="620" y="334" fill="#181818" font-family="Georgia, serif" font-size="21" font-weight="700">Index status race condition</text>
  <text x="620" y="370" fill="#87867F" font-family="Arial, sans-serif" font-size="15">search-index · status · watcher · rebuild</text>
  <rect x="930" y="319" width="96" height="32" rx="16" fill="#F0EEE6"/>
  <text x="953" y="340" fill="#181818" font-family="Arial, sans-serif" font-size="13">TURN</text>

  <circle cx="586" cy="502" r="14" fill="#3EA866"/>
  <text x="579" y="508" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">2</text>
  <text x="620" y="496" fill="#181818" font-family="Georgia, serif" font-size="21" font-weight="700">Keep the last healthy index</text>
  <text x="620" y="532" fill="#87867F" font-family="Arial, sans-serif" font-size="15">manifest · schema · fallback · ready</text>
  <rect x="930" y="481" width="96" height="32" rx="16" fill="#F0EEE6"/>
  <text x="948" y="502" fill="#181818" font-family="Arial, sans-serif" font-size="13">SESSION</text>

  <circle cx="586" cy="664" r="14" fill="#181818"/>
  <text x="579" y="670" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">3</text>
  <text x="620" y="658" fill="#181818" font-family="Georgia, serif" font-size="21" font-weight="700">Ataru search architecture</text>
  <text x="620" y="694" fill="#87867F" font-family="Arial, sans-serif" font-size="15">api · sdk · ai · source adapters</text>
  <rect x="930" y="643" width="96" height="32" rx="16" fill="#F0EEE6"/>
  <text x="946" y="664" fill="#181818" font-family="Arial, sans-serif" font-size="13">PROJECT</text>

  <path d="M1096 497H1134" stroke="#CC785C" stroke-width="4" stroke-linecap="round"/>
  <path d="M1124 487L1136 497L1124 507" stroke="#CC785C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#card-shadow)">
    <rect x="1160" y="216" width="352" height="562" rx="28" fill="#181818"/>
  </g>
  <text x="1200" y="268" fill="#F0EEE6" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CONTEXT</text>
  <text x="1200" y="319" fill="#FFFFFF" font-family="Georgia, serif" font-size="24" font-weight="700">Read the source,</text>
  <text x="1200" y="351" fill="#FFFFFF" font-family="Georgia, serif" font-size="24" font-weight="700">not just a result.</text>
  <path d="M1200 402H1470M1200 438H1428M1200 474H1450M1200 510H1386M1200 546H1462M1200 582H1416" stroke="#87867F" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  <rect x="1200" y="660" width="126" height="38" rx="19" fill="#CC785C"/>
  <text x="1231" y="685" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">OPEN SOURCE</text>
</svg>
