[workspace]
resolver = "2"
members = [
    "crates/lovcode-core",
    "src-tauri",
]

[workspace.package]
version = "0.40.0-dev"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lovstudio/lovcode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "io-util", "time", "process", "rt-multi-thread", "macros", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tantivy = "0.22"
jieba-rs = "0.7"
notify = "7"
regex = "1"
dirs = "6"
rayon = "1.12"
walkdir = "2"
tracing = "0.1"
